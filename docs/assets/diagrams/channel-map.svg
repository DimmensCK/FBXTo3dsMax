<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Geometry and data channels / 网格与数据通道</title><desc id="desc">Original conceptual mesh and UV diagram. Positions are per vertex, UV and normals are per face corner, material IDs and smoothing masks are per face. RGB map zero and alpha map minus two are independent.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#162b40"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#5ce0dc" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="480" rx="22" fill="url(#bg)"/>
<g font-family="Arial"><text x="36" y="47" font-size="25" font-weight="700" fill="#f2f6ff">One mesh. Several independent kinds of data.</text>
<text x="36" y="76" font-size="16" fill="#abc2d3" font-family="Microsoft YaHei">同一个网格，几何顶点 / 面角 / 面承载不同数据。</text>
<g stroke="#65d6d3" stroke-width="3" fill="#1c5060"><path d="M65 180L200 130L298 205L162 260Z"/><path d="M65 180L162 260L160 362L65 283Z"/><path d="M162 260L298 205L298 310L160 362Z"/><path d="M65 180L298 310M200 130L160 362" opacity=".4" fill="none"/></g>
